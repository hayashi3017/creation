services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creation_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # needs below, bacause .env file's setting isn't loaded in multi-stage build Dockerfile.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRED_IN: ${JWT_EXPIRED_IN}
      JWT_MAXAGE: ${JWT_MAXAGE}
    networks:
      - creation_network
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: creation_postgres
    restart: always
    ports:
      - "6500:5432" # PostgreSQL のデフォルトは 5432
    volumes:
      - creation_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - creation_network

  pgAdmin:
    image: dpage/pgadmin4
    container_name: pgAdmin
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgAdmin/servers.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      - db

  kv_store:
    image: redis:latest
    container_name: creation_redis
    networks:
      - creation_network

volumes:
  creation_db:

networks:
  creation_network:
